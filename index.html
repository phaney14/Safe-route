<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeRoute Application</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #map { height: 500px; width: 100%; }
        #sidebar { padding: 20px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>SafeRoute</h2>
        <p>Welcome to the SafeRoute application. Use the features below to plan your route and avoid left turns.</p>
        <button id="plan-route">Plan Route</button>
        <div id="route-planner"></div>
        <div id="turn-analysis"></div>
    </div>
    <div id="map"></div>
    <script>
        // Initialize Map
        function initMap() {
            var map = new google.maps.Map(document.getElementById('map'), {
                center: {lat: -34.397, lng: 150.644},
                zoom: 8
            });
        }

        // Function to plan route
        document.getElementById('plan-route').addEventListener('click', function() {
            // Logic for route planning avoiding left turns
            alert('Planning route avoiding left turns!');
        });

        // Load Google Maps API
        var script = document.createElement('script');
        script.src = 'https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap';
        script.async = true;
        document.head.appendChild(script);
    </script>
</body>
</html>
